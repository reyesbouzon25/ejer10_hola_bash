name: Ejecución de script
on:
  push:
    branches: [ main ]

jobs:
  ejecutar_script:
    runs-on: ubuntu-24.04
    steps:
    - name: descargar repositorio
      uses: actions/checkout@v5
      
    - name: muestra usuario
      run: 
        whoami
        
    - name: permisos script
      run: |
        pwd
        ls -l
        chmod +x src/hola.sh
       
    - name: ejectuta script
      run: 
        ./src/hola.sh
   
    - name: crear copia
      run: |
        mkdir -p backup
        zip -r backup/datos_backup.zip datos

    - name: Guardar el backup como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: backup-datos
          path: backup/datos_backup.zip