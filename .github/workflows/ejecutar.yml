name: Ejecutar script y hacer backup

on:
  push:

jobs:
  ejecutar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v4

      - name: Dar permisos de ejecución al script
        run: chmod +x src/hola.sh

      - name: Ejecutar el script
        run: ./src/hola.sh

      - name: Crear copia de seguridad
        run: |
          mkdir -p backup
          zip -r backup/datos_backup.zip datos

      - name: Guardar el backup como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: backup-datos
          path: backup/datos_backup.zip